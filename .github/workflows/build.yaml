name: build

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Images
        run: |
          docker build -f Dockerfile -t hp2-caddy:latest .
          docker build -f apps/homeportal/Dockerfile --target admin -t hp2-admin:latest apps/homeportal/
          docker build -f apps/homeportal/Dockerfile --target app -t hp2-app:latest apps/homeportal/
          docker build -f apps/homeportal/Dockerfile --target queue -t hp2-queue:latest apps/homeportal/
