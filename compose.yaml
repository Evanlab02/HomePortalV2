name: hp

services:
  maintenance:
    container_name: maintenance
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: "run --config /etc/caddy/maintenance/Caddyfile --adapter caddyfile"
    ports:
      - 80:80
    networks:
      - hp-network

  documentation:
    container_name: documentation
    restart: unless-stopped
    build:
      context: documentation
      dockerfile: Dockerfile.dev
    ports:
      - 81:8000
    networks:
      - hp-network

  app:
    container_name: app
    restart: unless-stopped
    build:
      context: apps/homeportal
      dockerfile: docker/dev/Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    networks:
      - hp-network

  valkey:
    image: valkey/valkey:8.1.4-alpine3.22
    container_name: valkey
    restart: unless-stopped
    volumes:
      - dev-valkey-data:/data
    networks:
      - hp-network

  postgres:
    container_name: postgres
    restart: unless-stopped
    image: postgres:17.6-alpine3.22
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE}'
        - '-U'
        - '${DB_USERNAME}'
      retries: 3
      timeout: 5s
    volumes:
      - 'dev-postgres-data:/var/lib/postgresql/data'
    networks:
      - hp-network

volumes:
  dev-valkey-data:
    external: false
  dev-postgres-data:
    external: false

networks:
  hp-network:
    driver: bridge
