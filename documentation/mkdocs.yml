site_name: Home Portal V2
site_url: https://evanlab02.github.io/HomePortalV2/
repo_url: https://github.com/evanlab02/HomePortalV2/
repo_name: HomePortalV2

extra:
  version:
    provider: mike

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - "pymdownx.inlinehilite"
  - "pymdownx.snippets"
  - "pymdownx.superfences"
  - "admonition"
  - "pymdownx.details"
  - "pymdownx.superfences"

theme:
  name: material
  features:
    - content.code.copy
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.prune
    - navigation.path
    - navigation.top
  palette: 
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home Portal: index.md
  - Features:
    - General: features/general.md
    - Cloudflare Integration: features/cloudflare.md
    - QBittorrent Integration: features/qbittorrent.md
    - Celery: features/celery.md
    - Permissions: features/permissions.md
    - History: features/history.md
    - Importing/Exporting: features/import_export.md
  - Architecture:
    - Overview: architecture/overview.md
    - Home Portal V2 Applications: architecture/hp_apps.md
    - Home Portal V2 Database Schemas: architecture/hp_db_schemas.md
    - Home Portal V2 Code: architecture/hp_code.md
  - Releases:
    - V1: releases/v1.md
  - Development/Contributing:
    - Important user documentation or architecture documentation for developers: development/index.md
    - Factory Boy: development/factory_boy.md
    - Linting and Type Checking: development/linting_type_checking.md
    - Unit Testing: development/unit_testing.md
    - Retries (Tenacity): development/tenacity.md
    - Django Admin:
      - Overview: development/admin/overview.md
      - Permissions: development/admin/permissions.md
      - Actions: development/admin/actions.md
  - Other:
    - Pre-requisities:
      - Tailscale: dependencies/tailscale.md
      - Cloudflare: dependencies/cloudflare.md
      - acme.sh: dependencies/acme.md
  - Changelog: CHANGELOG.md
