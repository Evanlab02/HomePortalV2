name: hp

include:
  - modules/actual/compose.ext.yml
  - modules/dns/compose.ext.yml
  - modules/files/compose.ext.yml
  - modules/flame/compose.ext.yml

services:
  caddy:
    container_name: caddy
    restart: unless-stopped
    image: ghcr.io/evanlab02/hp2-caddy:0.2.1  # x-release-please-version
    ports:
      - 443:443
      - 80:80
    volumes:
      - ./conf/certs/:/certs
      - ./conf/custom/:/etc/caddy
      - caddy-data:/data
    networks:
      - hp-network
    labels:
      - flame.type=application
      - flame.name=HomePortalV2 Documentation
      - flame.url=https://docs.labuschagne.xyz//HomePortalV2/
      - flame.icon=folder-open

  app:
    container_name: app
    restart: unless-stopped
    image: ghcr.io/evanlab02/hp2-app:0.2.1  # x-release-please-version
    env_file:
      - .env
    networks:
      - hp-network
    labels:
      - flame.type=application
      - flame.name=HomePortalV2 App/API
      - flame.url=https://app.labuschagne.xyz/api/v1/docs
      - flame.icon=folder-open

  admin:
    container_name: admin
    restart: unless-stopped
    image: ghcr.io/evanlab02/hp2-admin:0.2.1  # x-release-please-version
    env_file:
      - .env
    networks:
      - hp-network
    labels:
      - flame.type=application
      - flame.name=HomePortalV2 Administration
      - flame.url=https://admin.labuschagne.xyz/admin/
      - flame.icon=folder-open

  valkey:
    image: valkey/valkey:8.1.4-alpine3.22
    container_name: valkey
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      retries: 3
      timeout: 5s
    volumes:
      - valkey-data:/data
    networks:
      - hp-network

  postgres:
    container_name: postgres
    restart: unless-stopped
    image: postgres:17.6-alpine3.22
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE}'
        - '-U'
        - '${DB_USERNAME}'
      retries: 3
      timeout: 5s
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    networks:
      - hp-network

  authentik-server:
    container_name: authentik-server
    restart: unless-stopped
    image: ghcr.io/goauthentik/server:2025.8.3
    command: server
    env_file:
      - .env
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    depends_on:
      - postgres
      - valkey
    networks:
      - hp-network
    labels:
      - flame.type=application
      - flame.name=Authentik
      - flame.url=https://auth.labuschagne.xyz
      - flame.icon=shield-lock

  authentik-worker:
    container_name: authentik-worker
    restart: unless-stopped
    image: ghcr.io/goauthentik/server:2025.8.3
    command: worker
    env_file:
      - .env
    volumes:
      - authentik-certs:/certs
      - authentik-media:/media
      - authentik-templates:/templates
    depends_on:
      - postgres
      - valkey
    networks:
      - hp-network

volumes:
  caddy-data:
    external: false
  valkey-data:
    external: false
  postgres-data:
    external: false
  authentik-certs:
    external: false
  authentik-media:
    external: false
  authentik-templates:
    external: false

networks:
  hp-network:
    driver: bridge
