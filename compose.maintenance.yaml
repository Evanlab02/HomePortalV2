name: hp

services:
  maintenance:
    container_name: maintenance
    restart: unless-stopped
    image: ghcr.io/evanlab02/hp2-caddy:0.0.7  # x-release-please-version
    command: "run --config /etc/caddy/maintenance/Caddyfile --adapter caddyfile"
    ports:
      - 80:80
    volumes:
      - maintenance-data:/data
    networks:
      - hp-network

volumes:
  maintenance-data:
    external: false

networks:
  hp-network:
    driver: bridge
