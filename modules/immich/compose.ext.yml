services:
  immich-server:
    container_name: immich-server
    restart: unless-stopped
    image: ghcr.io/immich-app/immich-server:v1.129.0
    depends_on:
      - redis-immich
      - postgres-immich
    environment:
      - REDIS_HOSTNAME=redis-immich
      - DB_HOSTNAME=postgres-immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
    env_file:
      - .env
    ports:
      - 9998:2283
    healthcheck:
      disable: false
    volumes:
      - SETTOLOCATION:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    networks:
      - hp-network
    labels:
      - flame.type=application
      - flame.name=Immich
      - flame.url=https://images.labuschagne.xyz
      - flame.icon=camera

  immich-ml:
    container_name: immich-ml
    restart: unless-stopped
    image: ghcr.io/immich-app/immich-machine-learning:v1.129.0
    environment:
      - REDIS_HOSTNAME=redis-immich
      - DB_HOSTNAME=postgres-immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
    env_file:
      - .env
    healthcheck:
      disable: false
    volumes:
      - immich-ml-cache:/cache
    networks:
      - hp-network

  redis-immich:
    container_name: redis-immich
    restart: unless-stopped
    image: docker.io/redis:6.2-alpine@sha256:148bb5411c184abd288d9aaed139c98123eeb8824c5d3fce03cf721db58066d8
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - hp-network

  postgres-immich:
    container_name: hp-postgres-immich
    restart: unless-stopped
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
    command: >-
      postgres -c shared_preload_libraries=vectors.so -c 'search_path="$$user", public, vectors' -c logging_collector=on -c max_wal_size=2GB -c shared_buffers=512MB -c wal_compression=on
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    volumes:
      - immich-database-data:/var/lib/postgresql/data
    networks:
      - hp-network

volumes:
  immich-ml-cache:
    external: false
  immich-database-data:
    external: false
