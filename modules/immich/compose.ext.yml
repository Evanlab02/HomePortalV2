services:
  immich-server:
    container_name: immich_server
    restart: unless-stopped
    image: ghcr.io/immich-app/immich-server:v2.1.0
    depends_on:
      - immich-redis
      - immich-postgres
    environment:
      - REDIS_HOSTNAME=immich_redis
      - DB_HOSTNAME=immich_postgres
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
    env_file:
      - .env
    ports:
      - 9998:2283
    healthcheck:
      disable: false
    volumes:
      - SETTOLOCATION:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - hp-network
    labels:
      - flame.type=application
      - flame.name=Immich
      - flame.url=https://images.labuschagne.xyz
      - flame.icon=camera

  immich-machine-learning:
    container_name: immich_machine_learning
    restart: unless-stopped
    image: ghcr.io/immich-app/immich-machine-learning:v2.1.0
    env_file:
      - .env
    healthcheck:
      disable: false
    volumes:
      - immich-ml-cache:/cache
    networks:
      - hp-network

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  immich-postgres:
    container_name: immich_postgres
    restart: unless-stopped
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    shm_size: 128mb
    volumes:
      - immich-database-data:/var/lib/postgresql/data
    networks:
      - hp-network

volumes:
  immich-ml-cache:
    external: false
  immich-database-data:
    external: false
