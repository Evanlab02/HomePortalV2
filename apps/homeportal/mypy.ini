[mypy]
plugins = mypy_django_plugin.main

# Strict mode for maximum type safety
strict = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
warn_return_any = True
strict_equality = True
check_untyped_defs = True
disallow_untyped_decorators = True
disallow_any_generics = True

# Exclude specific files/patterns
exclude = (?x)(
    ^\.venv/
    | ^venv/
    | /migrations/
    | ^build/
    | ^dist/
  )

[mypy.plugins.django-stubs]
django_settings_module = "app.settings.dev.settings"
strict_settings = True

[mypy-*.migrations.*]
ignore_errors = True

# Exclude test files from strict checking (allow untyped defs, calls, and decorators)
[mypy-*.tests.*]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False

# Exclude admin mixins due to third-party inheritance conflicts
[mypy-utils.admin]
ignore_errors = True

# Third-party packages without type stubs
[mypy-celery.*]
ignore_missing_imports = True

[mypy-unfold.*]
ignore_missing_imports = True

# Allow untyped decorators in task/admin files due to celery/unfold decorators
[mypy-*.tasks]
disallow_untyped_decorators = False

[mypy-*.admin]
disallow_untyped_decorators = False

[mypy-constance.*]
ignore_missing_imports = True

[mypy-django_celery_beat.*]
ignore_missing_imports = True

[mypy-simple_history.*]
ignore_missing_imports = True

[mypy-guardian.*]
ignore_missing_imports = True

[mypy-import_export.*]
ignore_missing_imports = True
